name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node.js for optional resources
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build optional resource packages
        shell: powershell
        run: |
          $appVersion = python -c "import sys; sys.path.insert(0, 'src'); from player.constants import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao determinar a versão dos recursos opcionais." }
          python scripts/build_optional_resources.py --output-dir dist/optional-resources --app-version $appVersion --node-executable ((Get-Command node).Source)
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar os pacotes de recursos opcionais." }

      - name: Build application (PyInstaller)
        shell: powershell
        run: |
          $pythonStableAbiDll = python -c "import pathlib, sys; print(pathlib.Path(sys.base_prefix) / 'python3.dll')"
          pyinstaller --noconfirm --windowed --name KeyTune --hidden-import mpv --hidden-import webbrowser --collect-all mpv --collect-submodules accessible_output2 --collect-data accessible_output2 --collect-submodules winrt --collect-submodules winrt.windows.media --collect-submodules winrt.windows.media.playback --collect-submodules winrt.windows.foundation --exclude-module ytmusicapi --exclude-module librosa --exclude-module numpy --exclude-module scipy --exclude-module numba --exclude-module av --add-binary "$pythonStableAbiDll;." --add-data "src\player\autodj\sounds;player\autodj\sounds" src/main.py

      - name: Validate system media controls in packaged application
        shell: powershell
        run: |
          $process = Start-Process `
            -FilePath (Resolve-Path "dist\KeyTune\KeyTune.exe") `
            -ArgumentList "--smtc-smoke-test" `
            -Wait `
            -PassThru `
            -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "O executável não conseguiu inicializar os controles de mídia do sistema."
          }

      - name: Validate optional YouTube dependencies in packaged application
        shell: powershell
        run: |
          $testAppData = Join-Path (Resolve-Path "build") "youtube-resource-smoke"
          $resourceDir = Join-Path $testAppData "KeyTune\resources\youtube_music\youtube"
          Expand-Archive -LiteralPath "dist\optional-resources\KeyTune-YouTubePython-win-x64.zip" -DestinationPath $resourceDir
          $savedAppData = $env:APPDATA
          try {
            $env:APPDATA = $testAppData
            $process = Start-Process -FilePath (Resolve-Path "dist\KeyTune\KeyTune.exe") -ArgumentList "--youtube-dependencies-smoke-test" -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "As dependências opcionais do YouTube não puderam ser importadas." }
          } finally {
            $env:APPDATA = $savedAppData
          }

      - name: Download MPV runtime
        run: |
          python scripts/download_mpv_runtime.py --output-dir build\mpv-runtime

      - name: Download official yt-dlp executable
        run: |
          python scripts/download_yt_dlp_release.py --channel stable --output-dir dist\KeyTune

      - name: Compile translation catalogs
        run: |
          python scripts/i18n.py compile

      - name: Bundle translation catalogs
        shell: powershell
        run: |
          if (Test-Path "locale") {
            Copy-Item -Path "locale" -Destination "dist\KeyTune\locale" -Recurse -Force
          }

      - name: Render plugin documentation as HTML (per language)
        shell: powershell
        run: |
          foreach ($guide in Get-ChildItem -Path "docs" -Filter "plugins*.md") {
            python scripts/render_manual.py $guide.FullName ("dist\KeyTune\docs\" + $guide.BaseName + ".html")
            if ($LASTEXITCODE -ne 0) { throw "Falha ao renderizar documentação de plugins: $($guide.Name)." }
          }

      - name: Render manual as HTML (per language)
        shell: powershell
        run: |
          python scripts/render_manual.py docs/manual.md dist\KeyTune\docs\manual.html
          if ($LASTEXITCODE -ne 0) { throw "Falha ao renderizar o manual." }
          foreach ($manual in Get-ChildItem -Path "docs" -Filter "manual.*.md" -ErrorAction SilentlyContinue) {
            python scripts/render_manual.py $manual.FullName ("dist\KeyTune\docs\" + $manual.BaseName + ".html")
            if ($LASTEXITCODE -ne 0) { throw "Falha ao renderizar manual traduzido: $($manual.Name)." }
          }

      - name: Generate credits (per language)
        run: |
          python scripts/generate_credits.py --language pt_BR --language en --language es

      - name: Render credits as HTML (per language)
        shell: powershell
        run: |
          python scripts/render_manual.py docs/credits.md dist\KeyTune\docs\credits.html
          if ($LASTEXITCODE -ne 0) { throw "Falha ao renderizar os créditos." }
          foreach ($credit in Get-ChildItem -Path "docs" -Filter "credits.*.md" -ErrorAction SilentlyContinue) {
            python scripts/render_manual.py $credit.FullName ("dist\KeyTune\docs\" + $credit.BaseName + ".html")
            if ($LASTEXITCODE -ne 0) { throw "Falha ao renderizar créditos traduzidos: $($credit.Name)." }
          }

      - name: Bundle MPV runtime into dist
        shell: powershell
        run: |
          $targetRoot = "dist\KeyTune\mpv"
          New-Item -Path $targetRoot -ItemType Directory -Force | Out-Null
          Copy-Item -Path "build\mpv-runtime\*" -Destination $targetRoot -Recurse -Force

          $licenseDir = "dist\KeyTune\THIRD_PARTY_LICENSES"
          New-Item -Path $licenseDir -ItemType Directory -Force | Out-Null

          $possibleLicenseFiles = @(
            "build\mpv-runtime\LICENSE.txt",
            "build\mpv-runtime\COPYING.txt",
            "build\mpv-runtime\COPYING"
          )

          foreach ($file in $possibleLicenseFiles) {
            if (Test-Path $file) {
              Copy-Item -Path $file -Destination $licenseDir -Force
            }
          }

      - name: Derive installer version
        id: version
        shell: powershell
        run: |
          $ref = "${{ github.ref_name }}"
          $version = $ref -replace '^v', ''
          if (-not ($version -match '^\d+(\.\d+)*$')) { $version = "0.0.0" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer (Inno Setup)
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\keytune.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o instalador." }

      - name: Create installer checksum
        shell: powershell
        run: |
          $setup = "dist\KeyTune-Setup.exe"
          $checksumFile = "$setup.sha256"
          $hash = (Get-FileHash -Path $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path $checksumFile -Value "$hash  KeyTune-Setup.exe" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: KeyTune-windows
          path: |
            dist\KeyTune-Setup.exe
            dist\KeyTune-Setup.exe.sha256
            dist\optional-resources\*.zip
            dist\optional-resources\*.sha256

  publish-release:
    needs: build-release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: KeyTune-windows
          path: artifacts

      - name: Prepare release body
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $changelog = [System.IO.File]::ReadAllText((Resolve-Path "CHANGELOG.md"), $utf8)
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\].*?(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
            throw "Não foi possível localizar a seção da versão $version no CHANGELOG.md."
          }
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path "artifacts") "release-body.md"), $match.Value.Trim(), $utf8)

      - name: Publish installer to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/KeyTune-Setup.exe
            artifacts/KeyTune-Setup.exe.sha256
            artifacts/optional-resources/*.zip
            artifacts/optional-resources/*.sha256
          body_path: artifacts/release-body.md
