name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build application (PyInstaller)
        run: |
          pyinstaller --noconfirm --windowed --name KeyTune --hidden-import mpv --collect-all mpv --collect-submodules accessible_output2 --collect-data accessible_output2 --collect-data ytmusicapi --collect-submodules winrt --collect-submodules winrt.windows.media --collect-submodules winrt.windows.media.playback --collect-submodules winrt.windows.foundation src/main.py

      - name: Build updater (PyInstaller)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name KeyTuneUpdater src/updater_main.py

      - name: Download MPV runtime
        run: |
          python scripts/download_mpv_runtime.py --output-dir build\mpv-runtime

      - name: Bundle updater into dist
        shell: powershell
        run: |
          Copy-Item -Path "dist\KeyTuneUpdater.exe" -Destination "dist\KeyTune\KeyTuneUpdater.exe" -Force

      - name: Download official yt-dlp executable
        run: |
          python scripts/download_yt_dlp_release.py --channel stable --output-dir dist\KeyTune

      - name: Render manual as HTML
        run: |
          python scripts/render_manual.py docs/manual.md dist\KeyTune\docs\manual.html

      - name: Bundle MPV runtime into dist
        shell: powershell
        run: |
          $targetRoot = "dist\KeyTune\mpv"
          New-Item -Path $targetRoot -ItemType Directory -Force | Out-Null
          Copy-Item -Path "build\mpv-runtime\*" -Destination $targetRoot -Recurse -Force

          $licenseDir = "dist\KeyTune\THIRD_PARTY_LICENSES"
          New-Item -Path $licenseDir -ItemType Directory -Force | Out-Null

          $possibleLicenseFiles = @(
            "build\mpv-runtime\LICENSE.txt",
            "build\mpv-runtime\COPYING.txt",
            "build\mpv-runtime\COPYING"
          )

          foreach ($file in $possibleLicenseFiles) {
            if (Test-Path $file) {
              Copy-Item -Path $file -Destination $licenseDir -Force
            }
          }

      - name: Create release archive
        shell: powershell
        run: |
          $archiveName = "KeyTune-windows.zip"
          if (Test-Path $archiveName) {
            Remove-Item $archiveName -Force
          }
          Compress-Archive -Path "dist\KeyTune\*" -DestinationPath $archiveName

      - name: Create release checksum
        shell: powershell
        run: |
          $archiveName = "KeyTune-windows.zip"
          $checksumFile = "$archiveName.sha256"
          $hash = (Get-FileHash -Path $archiveName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path $checksumFile -Value "$hash  $archiveName" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: KeyTune-windows
          path: |
            KeyTune-windows.zip
            KeyTune-windows.zip.sha256

  publish-release:
    needs: build-release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: KeyTune-windows
          path: artifacts

      - name: Publish zip to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/KeyTune-windows.zip
            artifacts/KeyTune-windows.zip.sha256
          body_path: .github/release-notes.md
