name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build application (PyInstaller)
        run: |
          pyinstaller --noconfirm --windowed --name KeyTune --hidden-import mpv --collect-all mpv --collect-submodules accessible_output2 --collect-data accessible_output2 --collect-data ytmusicapi --collect-submodules winrt --collect-submodules winrt.windows.media --collect-submodules winrt.windows.media.playback --collect-submodules winrt.windows.foundation src/main.py

      - name: Download MPV runtime
        run: |
          python scripts/download_mpv_runtime.py --output-dir build\mpv-runtime

      - name: Download official yt-dlp executable
        run: |
          python scripts/download_yt_dlp_release.py --channel stable --output-dir dist\KeyTune

      - name: Render manual as HTML
        run: |
          python scripts/render_manual.py docs/manual.md dist\KeyTune\docs\manual.html

      - name: Generate credits
        run: |
          python scripts/generate_credits.py

      - name: Render credits as HTML
        run: |
          python scripts/render_manual.py docs/credits.md dist\KeyTune\docs\credits.html

      - name: Bundle MPV runtime into dist
        shell: powershell
        run: |
          $targetRoot = "dist\KeyTune\mpv"
          New-Item -Path $targetRoot -ItemType Directory -Force | Out-Null
          Copy-Item -Path "build\mpv-runtime\*" -Destination $targetRoot -Recurse -Force

          $licenseDir = "dist\KeyTune\THIRD_PARTY_LICENSES"
          New-Item -Path $licenseDir -ItemType Directory -Force | Out-Null

          $possibleLicenseFiles = @(
            "build\mpv-runtime\LICENSE.txt",
            "build\mpv-runtime\COPYING.txt",
            "build\mpv-runtime\COPYING"
          )

          foreach ($file in $possibleLicenseFiles) {
            if (Test-Path $file) {
              Copy-Item -Path $file -Destination $licenseDir -Force
            }
          }

      - name: Derive installer version
        id: version
        shell: powershell
        run: |
          $ref = "${{ github.ref_name }}"
          $version = $ref -replace '^v', ''
          if (-not ($version -match '^\d+(\.\d+)*$')) { $version = "0.0.0" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer (Inno Setup)
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\keytune.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o instalador." }

      - name: Create installer checksum
        shell: powershell
        run: |
          $setup = "dist\KeyTune-Setup.exe"
          $checksumFile = "$setup.sha256"
          $hash = (Get-FileHash -Path $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path $checksumFile -Value "$hash  KeyTune-Setup.exe" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: KeyTune-windows
          path: |
            dist\KeyTune-Setup.exe
            dist\KeyTune-Setup.exe.sha256

  publish-release:
    needs: build-release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: KeyTune-windows
          path: artifacts

      - name: Publish installer to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/KeyTune-Setup.exe
            artifacts/KeyTune-Setup.exe.sha256
          body_path: CHANGELOG.md
