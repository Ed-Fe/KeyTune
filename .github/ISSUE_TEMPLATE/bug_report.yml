name: Bug report
description: Describe a problem so we can reproduce and fix it. Você pode escrever em português.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report the problem. The clearer the context, the faster we can reproduce and fix it. You can write in English, Portuguese or Spanish.
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Describe the observed behavior, including anything the screen reader said or didn't say.
      placeholder: "When I pressed Enter on a YouTube video, nothing played and NVDA said nothing."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Explain the expected behavior.
      placeholder: "I expected the video to start playing."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the shortest steps that reproduce the bug, with the keys you pressed.
      placeholder: |
        1. Press Ctrl+Shift+Y to open KeyTube
        2. Search for any video and press Enter
        3. Nothing plays
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KeyTune version
      description: Shown in Help > About KeyTune.
      placeholder: "2.5.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: screen-reader
    attributes:
      label: Screen reader and version
      description: Leave empty if you don't use one.
      placeholder: "NVDA 2025.3"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: For playback, YouTube, download or radio problems, open Help > Diagnostics, choose Copy report and paste it here.
      render: text
  - type: textarea
    id: extras
    attributes:
      label: Logs or extra notes
      description: Paste error messages, the log file or useful links. Remove anything private, such as cookies or account details.
      placeholder: "Displayed message, log, file format, etc."
