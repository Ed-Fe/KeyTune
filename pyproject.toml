[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keytune"
description = "Keyboard-first music and video player for Windows, built for screen readers."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = [
    "wxPython",
    "python-mpv",
    "accessible-output2",
    "Markdown",
    "winrt-Windows.Media; sys_platform == 'win32'",
    "winrt-Windows.Media.Playback; sys_platform == 'win32'",
    "winrt-Windows.Foundation; sys_platform == 'win32'",
    "pyaudiowpatch>=0.2.12.9 ; sys_platform == 'win32'",
]

[project.scripts]
keytune = "main:main"

[dependency-groups]
dev = ["pyinstaller"]
# Optional integrations: release builds publish them as separate downloadable
# resources (see scripts/build_optional_resources.py).
youtube = ["ytmusicapi"]
autodj = ["librosa", "av", "numpy", "scipy", "numba", "llvmlite"]

[tool.hatch.version]
path = "src/player/constants.py"
pattern = 'APP_VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/player"]
include = ["src/main.py"]
sources = ["src"]

[tool.uv]
package = true
default-groups = ["dev", "youtube", "autodj"]
